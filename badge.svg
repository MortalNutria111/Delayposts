<svg width="96" height="20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="拖更天数: 170天">
  <title>拖更天数: 170天</title>
  <filter id="blur">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="96" height="20" rx="3"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="55" height="20" fill="#555555"/>
    <rect x="55" width="41" height="20" fill="#d73a4a"/>
    <rect width="96" height="20" fill="url(#s)"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <!-- 左侧标签 -->
    <g transform="scale(0.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="275.0" y="150" fill-opacity=".8" filter="url(#blur)" textLength="450.0">拖更天数</text>
        <text x="275.0" y="150" fill-opacity=".3" textLength="450.0">拖更天数</text>
      </g>
      <text x="275.0" y="140" textLength="450.0">拖更天数</text>
    </g>
    <!-- 右侧数值 -->
    <g transform="scale(0.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="755.0" y="150" fill-opacity=".8" filter="url(#blur)" textLength="310.0">170天</text>
        <text x="755.0" y="150" fill-opacity=".3" textLength="310.0">170天</text>
      </g>
      <text x="755.0" y="140" textLength="310.0">170天</text>
    </g>
  </g>
</svg>